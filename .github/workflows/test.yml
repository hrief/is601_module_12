name: CI/CD

on:
  push:
    branches: ['**']
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: mytestdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
      
      - name: Run tests
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/mytestdb
        run: python -m pytest --run-slow

  security:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build image
        run: docker build -t app:test .
      
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.76.2

      - name: Run Trivy vulnerability scanner
        run: |
          scan_status=0
          trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 10 --no-progress --format json --output trivy-results.json \
            app:test > trivy-report.txt 2>&1 || scan_status=$?
          if [ -s trivy-results.json ]; then
            jq -r '.Results[]? | .Vulnerabilities[]? |
              "\(.Severity) \(.VulnerabilityID) \(.PkgName) \(.InstalledVersion) → \(.FixedVersion)"' \
              trivy-results.json >> trivy-report.txt
          fi
          cat trivy-report.txt
          {
            echo '### Image vulnerability scan'
            echo '```text'
            cat trivy-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$scan_status" -eq 10 ]; then
            jq -r '.Results[]? | .Vulnerabilities[]? |
              "::error::\(.VulnerabilityID) \(.PkgName) \(.InstalledVersion) can be updated to \(.FixedVersion)"' \
              trivy-results.json
          elif [ "$scan_status" -ne 0 ]; then
            echo "::error::Trivy could not complete the image scan. See the workflow summary."
          fi
          exit "$scan_status"
  
  deploy:
    needs: security
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3
      
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - uses: docker/build-push-action@v5
        with:
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/is601_module_12:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/is601_module_12:${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/is601_module_12:latest
          cache-to: type=inline
